[character]
format = "$symbol "
success_symbol = "[❯](bold accent)"
error_symbol = "[❯](bold error)"
vimcmd_symbol = "[❮](bold interactive)"
vimcmd_replace_one_symbol = "[❮](bold warm)"
vimcmd_replace_symbol = "[❮](bold warm)"
vimcmd_visual_symbol = "[❮](bold info)"

[status]
disabled = false
style = "bold error"
symbol = "✖"
# Leerer success_symbol: status erscheint nur bei Exit != 0.
success_symbol = ""
format = " [$symbol $status]($style) "

[username]
show_always = false
style_user = "muted"
style_root = "bold error"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "muted"
format = "[@$hostname]($style)"

[directory]
style = "bold interactive"
read_only = " ro"
read_only_style = "muted"
truncation_length = 4
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = ""
style = "bold accent"
format = "[$branch]($style) "

[git_status]
style = "error"
format = "([$all_status]($style) )"
untracked = ""
ignore_submodules = true
ahead = ""
behind = ""
diverged = ""

[git_state]
style = "warm"
format = "[$state]($style) "

[kubernetes]
disabled = false
style = "interactive"
format = "[k8s $context(/$namespace)]($style) "
# Nur zeigen, wenn wirklich mit k8s gearbeitet wird (ODER-Verknuepfung).
detect_files = ["kustomization.yaml", "kustomization.yml", "Chart.yaml", "kind-config.yaml", "kind.yaml", "k8s.yaml"]
detect_folders = ["k8s", "kubernetes", "manifests", "helm", ".kube"]
detect_env_vars = ["KUBECONFIG"]

[aws]
style = "warm"
format = "[aws $profile]($style) "

[terraform]
style = "accent"
format = "[tf $workspace]($style) "

[cmd_duration]
min_time = 1000
style = "bold warm"
format = "[$duration]($style) "

[jobs]
symbol = "+"
style = "muted"
format = "[$symbol$number]($style) "

[time]
disabled = false
style = "muted"
format = "[$time]($style) "
