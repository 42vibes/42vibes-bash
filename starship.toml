# GENERIERT von build.py aus vendor/palette.json. Nicht direkt bearbeiten.
# Absichtlich keine Nerd-Font-Glyphen; siehe README ("Symbole").
"$schema" = "https://starship.rs/config-schema.json"
palette = "42vibes"
# Heller Hintergrund? Dann die naechste Zeile aktivieren:
# palette = "42vibes_light"
command_timeout = 1000
scan_timeout = 30
add_newline = false
format = "[╭─](muted) $time($username$hostname )$directory$git_branch$git_status$git_state$kubernetes$aws$terraform$cmd_duration$jobs$line_break[╰─](muted)$status$character"

